spring.application.name=demo
# application.properties : spring 관련 설정 코드 입력하는 파일
# 톰캣 포트 번호 지정 ( 기본값 8080 )
server.port = 8080
# 데이터베이스 연동
# 1. 연동할 DB 주소
#spring.datasource.url = jdbc:mysql://localhost:3306/mydb0902
spring.datasource.url = jdbc:mysql://localhost:3306/practice5
# 2. DB주소의 계정명 / 비밀번호
spring.datasource.username = root
spring.datasource.password = 1234
# DDL
# create : 서버 실행될 때 마다 엔티티 기반으로 데이터틀 삭제후 생성
# create-drop : 서버 실행될 때 엔티티 기반으로 테이블 생성 / 서버 종료시 삭제
# update : 서버 실행될 때 테이블이 존재하면 엔티티 수정 / 없으면 생성
# none : 사용안함
spring.jpa.hibernate.ddl-auto=create-drop
# 3. SQL 콘솔 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.data-locations=classpath:example/practice5/practice5.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
